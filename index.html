<head>

<style>
:root{--bg:#f3f1e8;--card:#fffdf6;--ink:#1d2a29;--mut:#5f6c69;--line:#d9d6c7;--head:#10312f;--headink:#f2eedd;--acc:#0d7f78;--gold:#a87510;--goldbg:#f7ecd0;--track:#e4e1d3}
@media (prefers-color-scheme:dark){:root{--bg:#0d1716;--card:#16302d;--ink:#e9efe9;--mut:#a1b3ae;--line:#2a4541;--head:#0a2321;--headink:#f2eedd;--acc:#41d1c3;--gold:#e3b95b;--goldbg:#3a3118;--track:#22403c}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--head);color:var(--headink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hrow{display:flex;align-items:center;gap:8px;min-height:40px}
h1{font:600 19px/1.2 Georgia,"Times New Roman",serif;margin:0;flex:1;min-width:0}
.back{background:none;border:0;color:inherit;font-size:26px;width:40px;height:40px;margin-left:-10px;line-height:1;cursor:pointer}
.find{background:none;border:1px solid #e3b95b;color:#e3b95b;font:600 14px system-ui,sans-serif;border-radius:8px;padding:0 10px;height:38px;cursor:pointer;white-space:nowrap;flex:none}
.sfields{display:flex;gap:10px;margin-bottom:10px}
.sfield{flex:1;min-width:0}
.sfield>label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
.sinput{display:flex;gap:6px}
.sinput input{min-width:0;font-size:18px;font-variant-numeric:tabular-nums}
.pm{flex:none;width:44px;min-height:44px;font:700 18px system-ui,sans-serif;color:var(--acc);background:transparent;border:1px solid var(--acc);border-radius:8px;cursor:pointer}
.sbtn{width:100%}
.serr{color:var(--gold);font-size:14px;font-weight:600;margin:8px 0 0}
.reslist{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.reslist .group:first-child,.reslist .group:first-child+.row{}
.sub{font-size:13px;opacity:.82;margin-top:2px}
main{padding:12px 16px;max-width:680px;margin:auto}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:7px}
header .bar{background:#2c4e4b}
.bar i{display:block;height:100%;background:var(--acc)}
header .bar i{background:#e3b95b}
.rcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 9px;color:inherit;font:inherit;cursor:pointer}
.rtop{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.rtop span:last-child{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:500}
.rmeta{font-size:13px;color:var(--mut);margin-top:3px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600;min-height:50px}
summary::-webkit-details-marker{display:none}
summary small{font-weight:500;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
summary .t::before{content:"▸";display:inline-block;width:16px;color:var(--mut)}
details[open] summary .t::before{content:"▾"}
.note{font-size:13px;color:var(--mut);padding:0 14px 10px}
.group{font-size:13px;font-weight:700;padding:9px 14px;border-top:1px solid var(--line);color:var(--mut);display:flex;justify-content:space-between;gap:10px}
.group.dbl{background:var(--goldbg);color:var(--gold)}
.row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line);min-height:50px;cursor:pointer}
.row.dbl{background:var(--goldbg)}
.row input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border:2px solid var(--mut);border-radius:6px;background:transparent;display:grid;place-content:center;cursor:pointer}
.row input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
.row input[type=checkbox]:checked::after{content:"";width:12px;height:7px;border:solid var(--card);border-width:0 0 3px 3px;transform:translateY(-2px) rotate(-45deg)}
.row input[type=checkbox]:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.body{flex:1;min-width:0}
.nm{overflow-wrap:anywhere}
.mt{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.done .nm{color:var(--mut);text-decoration:line-through}
.badge{display:inline-block;font-size:12px;font-weight:700;color:var(--gold);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:5px;text-decoration:none}
.chests{display:flex;gap:6px;flex:none}
.chests label{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);gap:2px;cursor:pointer}
.row .chests input[type=checkbox]{width:30px;height:30px;border-color:var(--gold);border-radius:5px}
.row .chests input[type=checkbox]:checked{background:var(--gold);border-color:var(--gold)}
.chests input:checked::after{content:"";width:12px;height:7px;border:solid var(--card);border-width:0 0 3px 3px;transform:translateY(-2px) rotate(-45deg)}
.tools{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;min-height:40px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--acc)}
input[type=search],input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
.add{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.btn{font:inherit;font-weight:600;border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:8px;padding:9px 14px;min-height:44px;cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--acc);color:var(--card)}
.x{background:none;border:0;color:var(--mut);font-size:22px;width:36px;height:36px;cursor:pointer;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--head);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:#c6d0ca;font:600 14px system-ui,sans-serif;padding:0 4px;height:58px;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:#e3b95b;border-top-color:#e3b95b}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.panel h2{font:600 17px Georgia,serif;margin:0 0 6px}
.panel p{margin:0 0 10px;font-size:14px;color:var(--mut)}
.panel a{color:var(--acc)}
.panel .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:12px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
</style>
</head>

function stats(r){
  let t=0,d=0,seeds=0,seedsD=0,c={};
  const count=(k,it,ok)=>{c[k]=c[k]||[0,0];c[k][1]++;t++;if(ok){c[k][0]++;d++}};
  r.koroks.forEach(k=>{seeds+=k.s;if(D(k.id))seedsD+=k.s;count(k.s==2?'dbl':'sgl',k,D(k.id))});
  r.shrines.forEach(s=>{count('shrine',s,D(s.id));for(let i=0;i<s.c;i++)count('chest',s,D(s.id+'#'+i))});
  r.caves.forEach(x=>count('cave',x,D(x.id)));
  r.wells.forEach(x=>count('well',x,D(x.id)));
  r.signs.forEach(x=>count('sign',x,D(x.id)));
  r.lock.forEach(x=>count('lock',x,D(x.id)));
  r.ccamp.forEach(x=>count('ccamp',x,D(x.id)));
  camps(r).forEach(x=>count('camp',x,D(x.id)));
  return{t,d,seeds,seedsD,c}
}

}

    if(S.hide&&on&&allC)return'';
    let ch='';for(let i=0;i<s.c;i++)ch+=`<label aria-label="Truhla ${i+1}"><input type="checkbox" data-id="${esc(s.id+'#'+i)}"${D(s.id+'#'+i)?' checked':''}></label>`;
    return`<div class="row${on?' done':''}"><input type="checkbox" aria-label="${esc(s.name)} dokončena" data-id="${esc(s.id)}"${on?' checked':''}><span class="body"><span class="nm">${esc(s.name)}</span><br><span class="mt">Truhly: ${s.c}${s.c==1?'+':''}${s.sky?' · nebe':''} · ${coord(s)}</span></span><span class="chests">${ch}</span></div>`
  }).join('');
  h+=sec(r.id+'s','Shrines',`${num(g(st,'shrine')[0],r.shrines.length)} · truhly ${num(g(st,'chest')[0],g(st,'chest')[1])}`,sh,'Levé pole je shrine, zlatá pole jsou truhly. Hra u shrine ukáže ikonu truhly, až když máš všechny.');
  const cp=camps(r).map(c=>`<div class="row${D(c.id)?' done':''}"><input type="checkbox" aria-label="${esc(c.name)}" data-id="${esc(c.id)}"${D(c.id)?' checked':''}><span class="body"><span class="nm">${esc(c.name)}</span></span><button class="x" data-del="${esc(c.id)}" aria-label="Smazat">×</button></div>`).join('');
  const lr=r.lock.map(x=>rowHtml(x.id,x.name,(x.co?x.co+' · ':'')+'≈ '+coord(x))).join('');
  const or=r.ccamp.map(x=>rowHtml(x.id,x.name,'≈ '+coord(x))).join('');
  const cTot=r.lock.length+r.ccamp.length+camps(r).length,cDone=g(st,'lock')[0]+g(st,'ccamp')[0]+g(st,'camp')[0];
  h+=sec(r.id+'m','Campy a zamčené truhly',num(cDone,cTot),`<div class="group dbl"><span>Odemkne je poražení nepřátel</span><span>${num(g(st,'lock')[0],r.lock.length)}</span></div>${lr||'<div class="empty">V seznamu tu žádná není.</div>'}<div class="group"><span>Další truhly v campech (zámek neuveden)</span><span>${num(g(st,'ccamp')[0],r.ccamp.length)}</span></div>${or||'<div class="empty">V seznamu tu žádná není.</div>'}<div class="group"><span>Moje nálezy</span><span>${num(g(st,'camp')[0],camps(r).length)}</span></div>${cp}<div class="add"><input type="text" id="campname" placeholder="Název nebo místo campu" maxlength="80"><button class="btn solid" id="addcamp">Přidat</button></div>`,'Seznam nemusí být úplný. Co najdeš navíc, přidej do Moje nálezy. Souřadnice jsou přibližné, ± asi 100 jednotek.');
  const otDone=r.other.filter(x=>D(x.id)).length;
  if(r.other.length)h+=sec(r.id+'o','Ostatní truhly',num(otDone,r.other.length),r.other.map(x=>rowHtml(x.id,x.name,ca(x)+(x.sky?' · nebe':''))).join(''),'Volitelné, nezapočítává se do procent oblasti. Popisy jsou anglicky.');
  const simple=(arr,key,title)=>{if(!arr.length)return'';return sec(r.id+key,title,num(g(st,{c:'cave',w:'well',a:'sign'}[key])[0],arr.length),arr.map(x=>rowHtml(x.id,x.name,coord(x))).join(''))};
  h+=simple(r.caves,'c','Jeskyně');
  h+=simple(r.wells,'w','Studně');
  h+=simple(r.signs,'a','Addison cedule');
  $('#main').innerHTML=h;
}
function renderDepth(d){
  const s=dSt(d);setHead(d.name+(d.id=='d-none'?'':' · Hlubiny'),`Hotovo ${s.n}/${s.t}`,pct(s.n,s.t),true);
  let h=`<div class="tools"><label class="toggle"><input type="checkbox" id="hide"${S.hide?' checked':''}>Skrýt hotové</label></div>`;
  DK.forEach(([k,title])=>{
    const a=d[k];if(!a.length)return;
    const ids=dIds(d,k),dn=ids.filter(D).length;
    let inner;
    if(k=='old')inner=a.map(o=>{const on=D(o.id),m=D(o.mid);if(S.hide&&on&&m)return'';
      return`<div class="row${on?' done':''}"><input type="checkbox" aria-label="${esc(o.name)} získáno" data-id="${esc(o.id)}"${on?' checked':''}><span class="body"><span class="nm">${esc(o.name)}</span><br><span class="mt">Poklad ${coord(o)} · mapa: ${esc(o.map)} (${esc(o.mc)})</span></span><span class="chests"><label aria-label="Mapa nalezena"><input type="checkbox" data-id="${esc(o.mid)}"${m?' checked':''}></label></span></div>`}).join('');
    else inner=a.map(i=>rowHtml(i.id,i.name,[i.sub,k=='chest'?ca(i):coord(i)].filter(Boolean).join(' · '))).join('');
    h+=sec(d.id+k,title,num(dn,ids.length),inner,k=='old'?'Levé pole je poklad, zlaté pole je stará mapa z nebe. Oblečení se propisuje i do záložky Obecné.':'');
  });
  $('#main').innerHTML=h;
}
function renderDepths(){
  let n=0,t=0;const tot={};
  DATA.depths.forEach(d=>{const s=dSt(d);n+=s.n;t+=s.t;DK.forEach(([k])=>{tot[k]=(tot[k]||0)+dIds(d,k).length})});
  setHead('Hlubiny',`Hotovo ${n}/${t}`,pct(n,t),false);
  $('#main').innerHTML=DATA.depths.map(d=>{const s=dSt(d);
    return`<button class="rcard" data-d="${d.id}"><span class="rtop"><span>${esc(d.name)}</span><span>${pct(s.n,s.t)} %</span></span><span class="rmeta" style="display:block">Lightroots ${num(dIds(d,'lr').filter(D).length,d.lr.length)} · truhly ${num(dIds(d,'chest').filter(D).length,d.chest.length)} · Yiga ${num(dIds(d,'yiga').filter(D).length,d.yiga.length)} · poklady ${d.old.filter(o=>D(o.id)).length}/${d.old.length} · chasmy ${num(dIds(d,'chasm').filter(D).length,d.chasm.length)}</span><span class="bar" style="display:block"><i style="width:${pct(s.n,s.t)}%"></i></span></button>`}).join('');
}
let sq={x:'',y:'',err:'',hit:null};
const parseC=s=>{s=String(s).replace(/[−–—]/g,'-').replace(/\s/g,'');return /^-?\d{1,5}$/.test(s)?parseInt(s,10):null};
function allItems(){
  const out=[];
  const add=(it,name,cat,region,layer,approx)=>{if(it.x===null||it.x===undefined)return;out.push({id:it.id,x:it.x,y:it.y,name,cat,region,layer,approx:!!approx})};
  DATA.regions.forEach(r=>{
    const gsi=r.name=='Great Sky Island',base=gsi?'nebe':'povrch';
    r.koroks.forEach(k=>{const nm=k.s==2?'Dvojitý Korok (2 semena)':(k.t||'Korok'),ly=k.l=='K'?'nebe':'povrch';add(k,nm,'Korok',r.name,ly);if(k.ax!=null)add({id:k.id,x:k.ax,y:k.ay},k.axu?'Korok (přiřazení k řádku je nejisté)':nm,k.axu?'Korok':'Korok, místo Koroka',r.name,ly)});
    r.shrines.forEach(s=>add(s,s.name,'Shrine',r.name,s.sky?'nebe':base));
    r.caves.forEach(c=>add(c,c.name,'Jeskyně',r.name,base));
    r.wells.forEach(c=>add(c,c.name,'Studně',r.name,base));
    r.signs.forEach(c=>add(c,c.name,'Addison cedule',r.name,base));
    r.lock.forEach(c=>add(c,c.name+(c.co?' ('+c.co+')':''),'Zamčená truhla',r.name,base,1));
    r.ccamp.forEach(c=>add(c,c.name,'Truhla v campu',r.name,base,1));
    r.other.forEach(c=>add(c,c.name,'Truhla',r.name,c.sky?'nebe':'povrch',1));
  });
  DATA.depths.forEach(d=>{
    DK.forEach(([k,title])=>{
      if(k=='old'){d.old.forEach(o=>{add(o,o.name,'Poklad ze staré mapy',d.name,'hlubiny');const m=String(o.mc).split(',').map(n=>parseInt(n,10));add({id:o.mid,x:m[0],y:m[1]},'Stará mapa: '+o.map+' → '+o.name,'Stará mapa',d.name,'nebe')});return}
      d[k].forEach(i=>{const surf=(k=='schema'&&/povrch/.test(i.sub||''))||(k=='barg'&&/povrch/.test(i.name));add(i,i.name,title,d.name,surf?'povrch':'hlubiny',k=='chest'||String(i.id).startsWith('re:'))});
    });
  });
  DATA.armor.forEach(g=>g.items.forEach(i=>{if(i.x!=null)add(i,i.name,g.name,i.region||i.where||'',i.layer||'povrch')}));
  return out;
}
const TOL=20,TOL_APPROX=150;
function runSearch(){
  const x=parseC(sq.x),y=parseC(sq.y);
  if(x===null||y===null){sq.err='Zadej obě souřadnice jako celá čísla, například -100 a 100.';sq.hit=null;return}
  sq.err='';
  const dist=i=>Math.round(Math.hypot(i.x-x,i.y-y));
  const all=allItems();
  const exact=all.filter(i=>!i.approx&&Math.abs(i.x-x)<=TOL&&Math.abs(i.y-y)<=TOL).sort((a,b)=>dist(a)-dist(b));
  const near=all.filter(i=>i.approx&&Math.abs(i.x-x)<=TOL_APPROX&&Math.abs(i.y-y)<=TOL_APPROX).sort((a,b)=>dist(a)-dist(b));
  const uniq=a=>{const s=new Set();return a.filter(i=>{const k=i.id;if(s.has(k))return false;s.add(k);return true})};
  sq.hit={x,y,exact:uniq(exact),near:uniq(near)};
}
function resRow(i){const m=`${i.cat} · ${i.region} · ${i.layer} · ${i.approx?'≈ ':''}${i.x}, ${i.y}`;return rowHtml(i.id,i.name,m,{keep:1})}
function renderSearch(){
  const h=sq.hit;
  setHead('Hledat podle souřadnic',h?`Okolo ${h.x}, ${h.y} · nalezeno: ${h.exact.length+h.near.length}`:'Zadej první dvě čísla ze hry',0,true);
  let o=`<div class="panel"><div class="sfields"><div class="sfield"><label for="sx">X</label><div class="sinput"><button class="pm" data-pm="sx" aria-label="Přepnout znaménko X">±</button><input type="text" inputmode="numeric" id="sx" value="${esc(sq.x)}" autocomplete="off" placeholder="-100"></div></div><div class="sfield"><label for="sy">Y</label><div class="sinput"><button class="pm" data-pm="sy" aria-label="Přepnout znaménko Y">±</button><input type="text" inputmode="numeric" id="sy" value="${esc(sq.y)}" autocomplete="off" placeholder="100"></div></div></div><button class="btn solid sbtn" id="sgo">Hledat ±20</button>${sq.err?`<p class="serr">${esc(sq.err)}</p>`:''}</div>`;
  if(h){
    o+=`<div class="reslist"><div class="group"><span>Přesná poloha, X ${h.x-TOL} až ${h.x+TOL}, Y ${h.y-TOL} až ${h.y+TOL}</span><span>${h.exact.length}</span></div>${h.exact.map(resRow).join('')||'<div class="empty">Nic v tomto rozsahu.</div>'}</div>`;
    o+=`<div class="reslist"><div class="group dbl"><span>Truhly a bossové s přibližnou polohou (±${TOL_APPROX})</span><span>${h.near.length}</span></div>${h.near.map(resRow).join('')||'<div class="empty">Nic v tomto rozsahu.</div>'}</div>`;
  }
  $('#main').innerHTML=o;
}
function renderRegions(){
  let d=0,t=0,sd=0,ss=0;
  const cards=DATA.regions.map(r=>{const st=stats(r);d+=st.d;t+=st.t;sd+=st.seedsD;ss+=st.seeds;
    return`<button class="rcard" data-r="${r.id}"><span class="rtop"><span>${esc(r.name)}</span><span>${pct(st.d,st.t)} %</span></span><span class="rmeta" style="display:block">Semínka ${st.seedsD}/${st.seeds} · shrines ${num(g(st,'shrine')[0],r.shrines.length)} · jeskyně ${num(g(st,'cave')[0],r.caves.length)} · studně ${num(g(st,'well')[0],r.wells.length)} · cedule ${num(g(st,'sign')[0],r.signs.length)}</span><span class="bar" style="display:block"><i style="width:${pct(st.d,st.t)}%"></i></span></button>`}).join('');
  setHead('Zelda: TOTK checklist',`Semínka ${sd}/${ss} · celkem ${d}/${t}`,pct(d,t),false);
  $('#main').innerHTML=cards;
}
let armorQ='';
function renderArmor(){
  const all=DATA.armor.flatMap(g=>g.items);const dn=all.filter(i=>D(i.id)).length;
  setHead('Obecné',`Hotovo ${dn}/${all.length}`,pct(dn,all.length),false);
  const q=armorQ.trim().toLowerCase();
  let h=`<div class="tools"><input type="search" id="q" placeholder="Hledat položku nebo místo" value="${esc(armorQ)}"><label class="toggle"><input type="checkbox" id="hide"${S.hide?' checked':''}>Skrýt hotové</label></div>`;
  DATA.armor.forEach(gr=>{
    const items=gr.items.filter(i=>!q||(i.name+' '+i.where).toLowerCase().includes(q));
    if(!items.length)return;
    const dd=gr.items.filter(i=>D(i.id)).length;
    const key='ar'+gr.id;if(q)S.open[key]=true;
    h+=sec(key,esc(gr.name),num(dd,gr.items.length),items.map(i=>rowHtml(i.id,i.name,[i.where,i.x!=null?coord(i):'',i.layer&&i.layer!='povrch'?i.layer:''].filter(Boolean).join(' · '))).join(''));
  });
  $('#main').innerHTML=h;
}
function renderData(){
  setHead('Záloha a zdroje','Postup se ukládá jen v tomto prohlížeči',0,false);
  $('#main').innerHTML=`<div class="panel"><h2>Záloha postupu</h2><p>Stáhni si soubor občas do mobilu. Když prohlížeč smaže data nebo změníš telefon, soubor nahraješ zpátky.</p><div class="acts"><button class="btn solid" id="exp">Stáhnout zálohu</button><button class="btn" id="imp">Nahrát zálohu</button><input type="file" id="file" accept="application/json,.json" hidden></div></div>
  <div class="panel"><h2>Jak číst údaje</h2><p><b>Oblasti:</b> shrines na povrchu jsou podle seznamu zón věží. Jeskyně, studně, cedule a shrines na nebi jsou zařazené výpočtem podle okolních Koroků, takže u hranice oblasti se může položka objevit o oblast vedle.</p><p><b>Truhly:</b> počet vychází z odměn v seznamech. „1+“ znamená nejméně jednu, skutečně jich může být víc.</p><p><b>Rabella Wetlands:</b> 15 Koroků má polohu ze Zelda Central, ale bez typu. Jeden z nich je dvojitý a není jisté, který.</p><p><b>Campy a truhly:</b> seznam vychází z 397 záznamů Gamer Guides. Zámek je potvrzený jen tam, kde to popis uvádí. Souřadnice jsou přepočtené z mapy, a proto přibližné.</p><p><b>Ostatní truhly:</b> povrch a nebe a 3 truhly z Lightning Temple. Truhly z Hlubin jsou v záložce Hlubiny. Zdroj nemusí obsahovat všechny truhly ve hře.</p><p><b>Hlubiny:</b> pevné počty sedí na zdroje: 120 Lightrootů, 36 chasmů, 34 Yiga, 12 Schema Stones, 7 Bargainer Statues, 31 starých map, 40 Frox a 20 Flux Constructů. Doly, místa a truhly (64) nemají ověřený celkový počet, takže seznam nemusí být úplný. Položky bez souřadnic jsou v oddílu Bez přesné polohy.</p><p><b>Obecné:</b> stáje, Dračí slzy a reliefy mají pevný počet. Chrámy, stáje, osady, obchody, slzy, víly a tablety sedí na Zelda Central. U Dračích slz je jen místo, ne název vzpomínky, aby to neprozrazovalo příběh.</p><p><b>Addison cedule:</b> zdroje uvádějí jen souřadnice, název je nejbližší známé místo.</p></div>
  <div class="panel"><h2>Zdroje</h2><p><a href="https://consolepulse.com/nintendo/zelda/guides/zelda-totk-all-korok-seeds-master-checklist" rel="noopener">Console Pulse</a>, <a href="https://www.thonky.com/zelda-tears-of-the-kingdom/list-of-shrines" rel="noopener">Thonky</a>, <a href="https://www.cheatcc.com/articles/the-legend-of-zelda-tears-of-the-kingdom-all-shrine-locations/" rel="noopener">CheatCC</a>, <a href="https://game8.co/games/Zelda-Tears-of-the-Kingdom/archives/411058" rel="noopener">Game8</a>, <a href="https://gamewith.net/zelda-totk/article/show/38862" rel="noopener">GameWith</a>, <a href="https://zeldacentral.com/games/tears-of-the-kingdom/checklist/" rel="noopener">Zelda Central</a>, <a href="https://www.gamerguides.com/the-legend-of-zelda-tears-of-the-kingdom/database/point-of-interest/treasure/treasure-chest" rel="noopener">Gamer Guides</a></p></div>`;
}
function render(){
  $('#find').hidden=!!view.search;
  if(view.search){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));renderSearch();return}
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==view.tab));
  if(view.tab=='armor')renderArmor();
  else if(view.tab=='data')renderData();
  else if(view.tab=='depths'){if(view.d)renderDepth(DATA.depths.find(d=>d.id==view.d));else renderDepths()}
  else if(view.r)renderRegion(DATA.regions.find(r=>r.id==view.r));
  else renderRegions();
}
function keepRender(){const y=window.scrollY;render();window.scrollTo(0,y)}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.id){if(t.checked)S.done[t.dataset.id]=1;else delete S.done[t.dataset.id];save();keepRender()}
  else if(t.id=='hide'){S.hide=t.checked;save();keepRender()}
  else if(t.id=='file'&&t.files[0]){t.files[0].text().then(x=>{const n=JSON.parse(x);if(!n||typeof n.done!='object')throw 0;S=Object.assign({done:{},camps:{},open:{},hide:false},n);save();render();alertBox('Záloha je nahraná.')}).catch(()=>alertBox('Tento soubor nejde nahrát.'))}
});
function alertBox(m){const p=document.createElement('div');p.className='panel';p.textContent=m;$('#main').prepend(p)}
document.addEventListener('input',e=>{if(e.target.id=='sx')sq.x=e.target.value;if(e.target.id=='sy')sq.y=e.target.value;if(e.target.id=='q'){armorQ=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.key;if(k){if(e.target.open)S.open[k]=true;else delete S.open[k];save()}},true);
document.addEventListener('click',e=>{
  const t=e.target,b=t.closest('button');if(!b)return;
  if(b.id=='find'){view.search=true;render();window.scrollTo(0,0);const f=$('#sx');if(f&&!sq.x)f.focus();return}
  if(b.id=='sgo'){sq.x=$('#sx').value;sq.y=$('#sy').value;runSearch();render();return}
  if(b.dataset.pm){const i=$('#'+b.dataset.pm);let v=i.value.trim().replace(/[−–—]/g,'-');i.value=v.startsWith('-')?v.slice(1):'-'+v;sq[b.dataset.pm=='sx'?'x':'y']=i.value;i.focus();return}
  if(b.id=='back'&&view.search){view.search=false;render();window.scrollTo(0,0);return}
  if(b.dataset.tab&&view.search)view.search=false;
  if(b.dataset.tab){const same=view.tab==b.dataset.tab;view={tab:b.dataset.tab,r:same&&b.dataset.tab=='regions'?null:view.r,d:same&&b.dataset.tab=='depths'?null:view.d};render();window.scrollTo(0,0)}
  else if(b.dataset.r){view.r=b.dataset.r;try{localStorage.setItem(KEY+'-r',view.r)}catch(x){}render();window.scrollTo(0,0)}
  else if(b.dataset.d){view.d=b.dataset.d;render();window.scrollTo(0,0)}
  else if(b.id=='back'&&view.tab=='depths'){view.d=null;render();window.scrollTo(0,0)}
  else if(b.id=='back'){view.r=null;try{localStorage.removeItem(KEY+'-r')}catch(x){}render();window.scrollTo(0,0)}
  else if(b.id=='addcamp'){const i=$('#campname'),n=i.value.trim();if(!n)return;(S.camps[view.r]=S.camps[view.r]||[]).push({id:'camp:'+view.r+':'+Date.now(),name:n});save();keepRender()}
  else if(b.dataset.del){e.preventDefault();S.camps[view.r]=camps({id:view.r}).filter(c=>c.id!=b.dataset.del);delete S.done[b.dataset.del];save();keepRender()}
  else if(b.id=='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='totk-zaloha.json';a.click()}
  else if(b.id=='imp')$('#file').click();
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.target.id=='sx'||e.target.id=='sy'))$('#sgo').click();if(e.key=='Enter'&&e.target.id=='campname')$('#addcamp').click()});
try{const r=localStorage.getItem(KEY+'-r');if(r&&DATA.regions.some(x=>x.id==r))view.r=r}catch(e){}
render();
</script>
